const defaults=()=>({roles:Object.fromEntries(roles.map(role=>[role.key,Object.fromEntries(rows.map(row=>[row.key,role.key==='admin'||permissions[row.key].includes(role.key)]))])),users:Object.fromEntries(demoUsers.map(user=>[user.id,{role:user.role,overrides:user.id==='zhangsan'?{model_config:'deny'}:user.id==='lisi'?{model_config_read:'grant'}:{}}]))});
const storageKey='piap-permissions-management-preview-v1';let saved=defaults();
try{const stored=JSON.parse(localStorage.getItem(storageKey));if(stored){for(const role of roles){if(role.key!=='admin')for(const row of rows){if(typeof stored.roles?.[role.key]?.[row.key]==='boolean')saved.roles[role.key][row.key]=stored.roles[role.key][row.key]}}for(const user of demoUsers){const storedUser=stored.users?.[user.id];if(!storedUser||user.id==='admin')continue;if(roles.some(role=>role.key===storedUser.role&&role.key!=='admin'))saved.users[user.id].role=storedUser.role;for(const row of rows){if(['grant','deny'].includes(storedUser.overrides?.[row.key]))saved.users[user.id].overrides[row.key]=storedUser.overrides[row.key]}}}}catch{}
let draft=structuredClone(saved);const state={tab:'roles',role:'algorithm_engineer',user:'zhangsan',group:'algorithm',query:'',expanded:''};
const roleName=key=>roles.find(role=>role.key===key).label;
const inherited=(key,user)=>draft.roles[user.role][key];
const effective=(key,user)=>user.role==='admin'||(user.overrides[key]==='deny'?false:user.overrides[key]==='grant'?true:inherited(key,user));
const tags=(items,css='')=>items.length?items.map(item=>`<span class="tag ${css}">${item}</span>`).join(''):'<span class="none">无</span>';
function filtered(){return features.filter(feature=>state.query?(feature.name+feature.rows.map(row=>row.description).join('')).includes(state.query):feature.group===state.group)}
function updateDirty(){const dirty=JSON.stringify(draft)!==JSON.stringify(saved);$('change-state').textContent=dirty?'有未保存的改动':'已保存';$('save').disabled=!dirty;$('discard').disabled=!dirty}
function render(){const isUser=state.tab==='users',user=draft.users[state.user],role=roles.find(role=>role.key===state.role),person=demoUsers.find(person=>person.id===state.user),locked=isUser?user.role==='admin':state.role==='admin',visible=filtered();
 $('role-tab').setAttribute('aria-selected',String(!isUser));$('user-tab').setAttribute('aria-selected',String(isUser));$('workspace').setAttribute('aria-labelledby',isUser?'user-tab':'role-tab');
 $('intro').textContent=isUser?'用户有效权限 = 角色默认权限 + 个人额外授权 − 个人撤销权限。调整某个人，仅影响这个用户。':'在角色里勾选或取消操作权限。同一角色的所有用户会继承改动；个人单独的授权、撤销继续生效。';
 $('entity-heading').textContent=isUser?'选择用户':'选择角色';$('entities').innerHTML=(isUser?demoUsers:roles).map(entity=>`<button class="entity" data-entity="${isUser?entity.id:entity.key}" aria-pressed="${isUser?state.user===entity.id:state.role===entity.key}"><strong>${isUser?entity.name:entity.label}</strong><small>${isUser?roleName(draft.users[entity.id].role):entity.subtitle}</small></button>`).join('');
 $('entity-title').textContent=isUser?`${person.name} · 用户授权`:role.label;$('entity-description').textContent=isUser?`当前角色：${roleName(user.role)} · 个人授权与角色默认分开显示`:`${role.description.replace('、组织','')} 对此角色的操作权限进行配置。`;
 $('user-role').hidden=!isUser;$('scope').hidden=isUser||locked;$('locked').hidden=!locked;$('legend').hidden=!isUser;$('save').textContent=isUser?'保存授权':'保存权限';
 $('user-role-select').innerHTML=roles.filter(item=>item.key!=='admin'||locked).map(item=>`<option value="${item.key}" ${user.role===item.key?'selected':''}>${item.label}</option>`).join('');$('user-role-select').disabled=locked;
 $('modules').innerHTML=groups.map(group=>`<button data-module="${group.key}" aria-pressed="${!state.query&&state.group===group.key}">${group.key==='organization'?'人员与权限':group.label}</button>`).join('');
 $('table').classList.toggle('user-table',isUser);$('table').hidden=!visible.length;$('empty').hidden=!!visible.length;
 $('head').innerHTML=isUser?'<tr><th>功能</th><th>角色默认</th><th>个人调整</th><th>最终可执行</th><th>操作</th></tr>':'<tr><th>功能</th><th>允许执行的操作</th></tr>';
 $('body').innerHTML=visible.map(feature=>{const label=`<strong>${feature.name}</strong><small>${groups.find(group=>group.key===feature.group).label}</small>`;if(!isUser)return `<tr><td>${label}</td><td><div class="permissions">${feature.rows.map(row=>`<label class="permission"><input type="checkbox" data-permission="${row.key}" ${draft.roles[state.role][row.key]?'checked':''} ${locked?'disabled':''} aria-label="${role.label} ${feature.name} ${row.operation}">${row.operation}</label>`).join('')}</div></td></tr>`;
 const base=feature.rows.filter(row=>inherited(row.key,user)).map(row=>row.operation),extra=feature.rows.filter(row=>user.overrides[row.key]==='grant').map(row=>'+ '+row.operation),denied=feature.rows.filter(row=>user.overrides[row.key]==='deny').map(row=>'− '+row.operation),final=feature.rows.filter(row=>effective(row.key,user)).map(row=>row.operation);const adjustments=extra.length||denied.length?(extra.length?tags(extra,'extra'):'')+(denied.length?tags(denied,'denied'):''):'<span class="none">继承角色</span>';
 return `<tr><td>${label}</td><td>${tags(base)}</td><td>${adjustments}</td><td>${tags(final,'extra')}</td><td><button class="detail-btn" data-adjust="${feature.id}" aria-expanded="${state.expanded===feature.id}" ${locked?'disabled':''}>${state.expanded===feature.id?'收起':'调整'}</button></td></tr>${state.expanded===feature.id&&!locked?`<tr class="adjust-row"><td colspan="5">${feature.rows.map(row=>`<label class="adjustment"><strong>${row.operation}</strong><select class="select" data-override="${row.key}" aria-label="${person.name} ${feature.name} ${row.operation}"><option value="inherit" ${!user.overrides[row.key]?'selected':''}>继承角色默认</option><option value="grant" ${user.overrides[row.key]==='grant'?'selected':''}>额外授权</option><option value="deny" ${user.overrides[row.key]==='deny'?'selected':''}>撤销权限</option></select><span>角色默认：${inherited(row.key,user)?'允许':'不允许'}</span></label>`).join('')}</td></tr>`:''}`}).join('');
 $('count').textContent=`当前 ${visible.length} 个功能 · ${isUser?person.name:role.label}`;$('footer-hint').textContent=isUser?'“最终可执行”显示个人调整后的实际授权':'管理员默认拥有全部功能权限';updateDirty();}
for(const [id,tab] of [['role-tab','roles'],['user-tab','users']])$(id).addEventListener('click',()=>{state.tab=tab;state.expanded='';render()});
document.querySelector('.tabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const next=event.key==='Home'?'role-tab':event.key==='End'?'user-tab':state.tab==='roles'?'user-tab':'role-tab';$(next).click();$(next).focus()});
$('entities').addEventListener('click',event=>{const button=event.target.closest('[data-entity]');if(!button)return;state[state.tab==='roles'?'role':'user']=button.dataset.entity;state.expanded='';render()});
$('modules').addEventListener('click',event=>{const button=event.target.closest('[data-module]');if(!button)return;state.group=button.dataset.module;state.query='';state.expanded='';$('search').value='';render()});
$('search').addEventListener('input',event=>{state.query=event.target.value.trim();render()});
$('body').addEventListener('click',event=>{const button=event.target.closest('[data-adjust]');if(!button)return;state.expanded=state.expanded===button.dataset.adjust?'':button.dataset.adjust;render();$('body').querySelector(`[data-adjust="${button.dataset.adjust}"]`).focus()});
$('body').addEventListener('change',event=>{const input=event.target;if(input.dataset.permission&&state.role!=='admin'){draft.roles[state.role][input.dataset.permission]=input.checked;updateDirty()}if(input.dataset.override&&draft.users[state.user].role!=='admin'){const key=input.dataset.override,user=draft.users[state.user];if(input.value==='inherit')delete user.overrides[key];else user.overrides[key]=input.value;render();$('body').querySelector(`[data-override="${key}"]`).focus()}});
$('user-role-select').addEventListener('change',event=>{if(state.user==='admin')return;draft.users[state.user].role=event.target.value;render()});
let toastTimer;function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3000)}
$('save').addEventListener('click',()=>{try{localStorage.setItem(storageKey,JSON.stringify(draft));saved=structuredClone(draft);updateDirty();toast('已保存演示授权，刷新页面仍保留')}catch{toast('浏览器未能保存，请保留当前页面。')}});
$('discard').addEventListener('click',()=>{draft=structuredClone(saved);render();toast('已撤销未保存的改动')});
window.addEventListener('beforeunload',event=>{if(JSON.stringify(draft)!==JSON.stringify(saved)){event.preventDefault();event.returnValue=''}});render();
</script>
</body>
</html>
