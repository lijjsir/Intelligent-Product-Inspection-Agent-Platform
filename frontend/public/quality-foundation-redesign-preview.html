<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIAP · 资料接入与按需档案预览</title>
<style>
:root{--ink:#182d40;--muted:#5d7181;--line:#dce4ec;--blue:#1464b9;--bg:#f2f5f8;--nav:#142b40;--green:#20654e;--amber:#8b5911}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{outline-offset:3px}button:focus-visible,a:focus-visible{outline:3px solid #73afe6}button{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:white;border-radius:5px;min-height:38px;padding:6px 14px;color:var(--ink)}button:hover{border-color:#86b3d7;background:#f1f7fd}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.link{border:0;color:var(--blue);background:transparent;padding:4px 0}button:disabled{opacity:.55;cursor:not-allowed}aside{position:fixed;inset:0 auto 0 0;width:218px;background:var(--nav);color:#d6e3ee;padding:23px 14px;overflow-y:auto}.brand{font-family:Georgia,serif;font-size:29px;color:white;letter-spacing:3px;font-weight:bold;padding:0 12px}.brand-sub{padding:0 12px 22px;color:#a2bccf;font-size:12px}.nav-group{padding:21px 12px 8px;color:#95b0c4;font-size:12px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:#e2ebf2;margin:3px 0;padding:10px 12px;min-height:44px}.nav:hover{background:#233e54;border:0}.nav.active{background:#245d8a;color:white}.nav-note{margin:27px 12px 0;padding-top:16px;border-top:1px solid #3b4f60;color:#a9bccd;font-size:12px}header.top{height:64px;display:flex;align-items:center;justify-content:space-between;margin-left:218px;padding:0 28px;border-bottom:1px solid var(--line);background:#fff}.account{display:flex;align-items:center;gap:12px;color:var(--muted)}.avatar{width:32px;height:32px;border-radius:50%;background:#e7eff7;color:var(--blue);display:grid;place-items:center}main{margin-left:218px;padding:23px 28px 48px;max-width:1700px}.preview{font-size:12px;margin:0 0 21px;padding:9px 12px;background:#fff8e9;border:1px solid #ebd7ac;color:#775522;border-radius:4px}.heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:5px}h1{font-size:24px;margin:0;font-weight:650;letter-spacing:.02em}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0 0 6px}.heading>button{flex-shrink:0}.heading p{margin:6px 0 0;color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:16px 0}.toolbar input{width:330px;max-width:100%;background:white}input,select{border:1px solid #becbd6;border-radius:4px;min-height:40px;padding:8px 10px;color:var(--ink);background:white;width:100%}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto}.tabs button{border:0;background:transparent;border-radius:0;color:var(--muted);padding:10px 1px 12px;min-height:44px;white-space:nowrap}.tabs button.active{color:var(--blue);box-shadow:inset 0 -3px var(--blue);font-weight:bold}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th{font-weight:normal;color:var(--muted);font-size:12px;background:#f9fafc;white-space:nowrap}td,th{padding:14px 17px;border-bottom:1px solid #e8edf2}tbody tr:hover{background:#f8fbfe}tbody tr:last-child td{border:0}td strong{display:block;font-weight:600}small{color:var(--muted);font-size:12px}.mono{font-family:Consolas,monospace;font-size:12px}.tag{display:inline-block;padding:2px 7px;background:#edf5f1;color:var(--green);font-size:12px;border:1px solid #d2e4db;border-radius:3px;white-space:nowrap}.tag.pending{color:var(--amber);background:#fff7e8;border-color:#ebd8b4}.tag.gray{background:#f1f4f7;color:var(--muted);border-color:#dce4ec}.footer{padding:12px 17px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.hint{display:flex;gap:15px;align-items:flex-start;padding:17px 0;color:var(--muted);font-size:12px}.hint strong{color:var(--ink);white-space:nowrap}.stats{display:flex;gap:30px;padding:16px 0;color:var(--muted);font-size:12px}.stats strong{font-size:20px;color:var(--ink);margin-right:7px}.breadcrumb{margin-bottom:16px;color:var(--muted)}.breadcrumb button{font-size:13px}.detail-grid{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:22px 36px}.datum span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.datum strong{font-weight:500}.section-bar{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;gap:14px;border-bottom:1px solid var(--line)}.empty{padding:36px 22px;text-align:center;color:var(--muted)}.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.rule-block{padding:23px}.rule-block p{color:var(--muted);margin:7px 0}.steps{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.steps div{border-left:3px solid #acc7df;padding:4px 14px}.steps strong{display:block}.subtle{color:var(--muted)}.flow{margin-top:16px;padding:17px;border:1px solid var(--line);background:#fff;display:flex;flex-wrap:wrap;gap:12px}.flow span{padding:8px 13px;background:#f2f6fa;border-radius:4px}.flow i{align-self:center;color:#7194b0;font-style:normal}.ref-links{margin:20px 0;font-size:12px;display:flex;gap:18px;flex-wrap:wrap}.ref-links a{color:var(--blue)}dialog{border:1px solid var(--line);border-radius:8px;width:570px;max-width:calc(100vw - 24px);padding:0;color:var(--ink);box-shadow:0 15px 65px #102d4050}dialog::backdrop{background:#10283866}.dialog-head{padding:18px 22px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);align-items:center}.dialog-head h2{margin:0}.form-body{padding:20px 22px;max-height:65vh;overflow:auto}.field{display:block;margin-bottom:16px}.field>span{display:block;margin-bottom:6px}.field small{display:block;margin-top:5px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.dialog-foot{display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);padding:15px 22px}.error{color:#b02e2e;margin:0 0 10px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#183e58;color:white;border-radius:6px;display:none;z-index:10}.mobile-title{display:none}a{overflow-wrap:anywhere}@media(max-width:1000px){aside{width:178px}header.top,main{margin-left:178px}main{padding:20px}.hide-medium{display:none}.rule-grid{grid-template-columns:1fr}}@media(max-width:650px){aside{position:static;width:100%;padding:12px;overflow:visible}.brand{font-size:22px;padding:0}.brand-sub,.nav-group,.nav-note{display:none}.nav{display:inline-block;width:auto;padding:8px;margin:3px;min-height:44px}.nav-container{display:flex;overflow-x:auto;white-space:nowrap}.brand{margin-bottom:7px}header.top{margin:0;height:52px;padding:0 16px}main{margin:0;padding:17px 14px 40px}.hide-mobile{display:none}.heading{align-items:flex-start}h1{font-size:21px}.heading p{font-size:12px}.toolbar{gap:8px}.toolbar input{width:100%}.preview{font-size:11px}.detail-grid{grid-template-columns:1fr;padding:18px}.tabs{gap:18px}td,th{padding:12px 10px}.steps{grid-template-columns:1fr}.form-row{grid-template-columns:1fr;gap:0}.stats{gap:16px}.stats strong{font-size:17px}.rule-block{padding:17px}.hint{display:block}.hint strong{display:block;margin-bottom:5px}.ref-links{gap:9px}.footer{font-size:11px}}
</style>
</head>
<body>
<aside><div class="brand">PIAP</div><div class="brand-sub">质量风险与可信决策</div><nav class="nav-container" aria-label="质监资料工作区"><div class="nav-group">首版业务入口</div><button class="nav active" data-view="intake">资料接入</button><div class="nav-group">按需查看与确认</div><button class="nav" data-view="archives">企业与产品档案</button><button class="nav" data-view="categories">分类与业务字典</button><div class="nav-group">依据与规则</div><button class="nav" data-view="standards">标准与检验规则</button><button class="nav" data-view="rules">风险与复核规则</button><div class="nav-group">后续 / 高级设置</div><button class="nav" data-view="sources">自动接入设置</button><button class="nav" data-view="architecture">关系与配置职责</button></nav><div class="nav-note">先接收资料<br>据实际任务补充对象信息</div></aside>
<header class="top"><strong>资料与研判工作区</strong><div class="account"><span class="hide-mobile">基础配置 · 设计评审</span><span class="avatar">管</span></div></header>
<main><div class="preview">架构与布局预览 · 所有企业、产品、批次均为演示数据 · 表单仅在本页内存保存，刷新重置</div><div id="content"></div></main>
<dialog id="editor" aria-labelledby="form-title"><form id="edit-form"><div class="dialog-head"><h2 id="form-title"></h2><button type="button" id="close-form" aria-label="关闭表单">关闭</button></div><div class="form-body" id="form-fields"></div><div class="dialog-foot"><button type="button" id="cancel-form">取消</button><button type="submit" class="primary">保存演示记录</button></div></form></dialog>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={view:'archives',tab:'enterprises',query:'',detail:null,detailTab:'basic'};
const enterprises=[{id:'e1',name:'演示制造企业 A',credit:'待核验',role:'生产者',city:'重庆市',status:'已确认（演示）'},{id:'e2',name:'演示销售企业 B',credit:'未提供',role:'销售者',city:'重庆市',status:'待确认'}];
const products=[{id:'p1',name:'电动自行车',category:'电动自行车',brand:'演示品牌 A',model:'DEMO-E1',manufacturer:'e1',sellers:['e2'],status:'已确认（演示）'},{id:'p2',name:'便携式充电宝',category:'充电宝',brand:'演示品牌 C',model:'型号待补充',manufacturer:null,sellers:[],status:'待确认'}];
const batches=[{id:'b1',product:'p1',no:'DEMO-20260901',date:'2026-09-01',quantity:100,status:'已确认（演示）'},{id:'b2',product:'p1',no:'DEMO-20260915',date:'待补证',quantity:null,status:'待确认'}];
const sources=[{name:'人工业务登记',party:'本组织业务人员',types:'投诉、咨询、专家意见',connector:'人工',status:'可用（演示）'},{name:'历史抽查文件',party:'授权资料提供方',types:'监督抽查、检测报告',connector:'文件',status:'待配置映射'},{name:'外部投诉系统',party:'待确认授权',types:'消费投诉',connector:'API',status:'尚未接通'}];
let categories=['消防产品','电线电缆','充电宝','电动自行车','成品油'];
const tag=s=>`<span class="tag ${/待|尚未/.test(s)?'pending':''}">${esc(s)}</span>`;
const ent=id=>enterprises.find(x=>x.id===id);const prod=id=>products.find(x=>x.id===id);
function heading(title,desc,action=''){return `<div class="heading"><div><div class="eyebrow">${['archives','categories'].includes(state.view)?'基础档案':state.view==='sources'?'数据接入':'依据与架构'}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function tabs(items,current){return `<div class="tabs" role="tablist">${items.map(([k,n])=>`<button role="tab" aria-selected="${current===k}" data-tab="${k}" class="${current===k?'active':''}">${n}</button>`).join('')}</div>`}
function table(headers,rows){return `<div class="panel"><div class="table-wrap"><table><thead><tr>${headers.map(([n,c])=>`<th class="${c||''}">${n}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}"><div class="empty">没有匹配的演示记录</div></td></tr>`}</tbody></table></div><div class="footer">${rows.length} 条演示记录 · 本页仅展示演示数据</div></div>`}
function row(x,type){if(type==='enterprises')return `<tr><td><strong>${esc(x.name)}</strong></td><td class="hide-mobile mono">${esc(x.credit)}</td><td>${esc(x.role)}</td><td class="hide-medium">${esc(x.city)}</td><td class="hide-mobile">${products.filter(p=>p.manufacturer===x.id||p.sellers.includes(x.id)).length}</td><td class="hide-mobile">${tag(x.status)}</td><td><button class="link" data-detail="enterprise:${x.id}">查看档案</button></td></tr>`;if(type==='products')return `<tr><td><strong>${esc(x.name)}</strong><small>${esc(x.brand)} · ${esc(x.model)}</small></td><td class="hide-mobile">${esc(x.category)}</td><td class="hide-mobile">${esc(ent(x.manufacturer)?.name||'待确认')}</td><td class="hide-medium">${batches.filter(b=>b.product===x.id).length}</td><td class="hide-mobile">${tag(x.status)}</td><td><button class="link" data-detail="product:${x.id}">查看档案</button></td></tr>`;return `<tr><td><strong class="mono">${esc(x.no)}</strong><small>${esc(prod(x.product)?.name)}</small></td><td class="hide-mobile">${esc(prod(x.product)?.model)}</td><td>${esc(x.date)}</td><td class="hide-medium">${x.quantity??'未知'}</td><td class="hide-mobile">${tag(x.status)}</td><td><button class="link" data-detail="product:${x.product}" data-detail-tab="batches">查看产品</button></td></tr>`}
const headers={enterprises:[['企业名称'],['信用代码','hide-mobile'],['主体角色'],['所在地','hide-medium'],['关联产品','hide-mobile'],['档案状态','hide-mobile'],['操作']],products:[['产品 / 型号'],['类别','hide-mobile'],['制造主体','hide-mobile'],['生产批次','hide-medium'],['档案状态','hide-mobile'],['操作']],batches:[['生产批次 / 产品'],['型号','hide-mobile'],['生产日期'],['数量','hide-medium'],['状态','hide-mobile'],['操作']]};
function archive(){const type=state.tab;const list=({enterprises,products,batches})[type].filter(x=>JSON.stringify(x).toLowerCase().includes(state.query.toLowerCase()));return heading('企业与产品档案','按对象查看，在详情中登记关联产品和生产批次。',`<button class="primary" data-create="${type}">新增${{enterprises:'企业',products:'产品',batches:'生产批次'}[type]}</button>`)+tabs([['enterprises','企业'],['products','产品 / 型号'],['batches','生产批次']],type)+`<div class="toolbar"><label class="sr-only" for="search">档案搜索</label><input id="search" value="${esc(state.query)}" placeholder="按名称、型号或真实批次号搜索"><button id="search-btn">查询</button><button id="reset-btn">重置</button></div>`+table(headers[type],list.map(x=>row(x,type)))+`<div class="hint"><strong>按关系登记</strong><span>企业档案 → 关联产品；产品档案 → 生产批次。未知主体、型号或批次的质量材料可以先受理，再确认关联。</span></div>`}
function datum(name,value){return `<div class="datum"><span>${esc(name)}</span><strong>${esc(value)}</strong></div>`}
function detail(){const [kind,id]=state.detail.split(':');const x=kind==='enterprise'?ent(id):prod(id);const items=kind==='enterprise'?[['basic','基本资料'],['products','关联产品'],['materials','质量资料'],['history','变更记录']]:[['basic','基本资料'],['enterprises','企业关系'],['batches','生产批次'],['standards','适用标准'],['materials','质量资料']];let body='';if(state.detailTab==='basic'){body=`<div class="panel detail-grid">${(kind==='enterprise'?[datum('企业名称',x.name),datum('统一社会信用代码',x.credit),datum('主体角色',x.role),datum('所在地',x.city)]:[datum('产品名称',x.name),datum('产品类别',x.category),datum('品牌 / 型号',x.brand+' / '+x.model),datum('制造主体',ent(x.manufacturer)?.name||'待确认')]).join('')}${datum('档案状态',x.status)}${datum('资料来源','演示档案；不代表真实主体已核验')}</div>`}else if(state.detailTab==='products'){const rows=products.filter(p=>p.manufacturer===id||p.sellers.includes(id));body=`<div class="section-bar"><strong>本企业关联的产品</strong><button data-create="products" data-parent="${id}" class="primary">登记关联产品</button></div>`+table(headers.products,rows.map(p=>row(p,'products')))}else if(state.detailTab==='batches'){const rows=batches.filter(b=>b.product===id);body=`<div class="section-bar"><strong>产品：${esc(x.name)} · ${esc(x.model)}</strong><button data-create="batches" data-parent="${id}" class="primary">登记生产批次</button></div>`+table(headers.batches,rows.map(b=>row(b,'batches')))}else if(state.detailTab==='enterprises'){const rows=[...[x.manufacturer].filter(Boolean).map(v=>[ent(v),'制造主体']),...x.sellers.map(v=>[ent(v),'销售主体'])];body=table([['企业名称'],['产品关系'],['操作']],rows.map(([e,r])=>`<tr><td>${esc(e.name)}</td><td>${r}</td><td><button class="link" data-detail="enterprise:${e.id}">查看档案</button></td></tr>`))}else{const texts={standards:'待专家依据产品、生产日期和使用场景确认适用标准。新规则发布不自动更改历史任务依据。',materials:'此处聚合该对象已获授权的投诉、报告、图片与案件。演示未连接真实材料库。',history:'确认人、变更前后内容和依据保留在档案历史。内部版本不占用主列表核心列。'};body=`<div class="panel empty">${texts[state.detailTab]||'待补充'}</div>`}return `<div class="breadcrumb"><button class="link" id="back">企业与产品档案</button> / ${esc(x.name)}</div>`+heading(x.name,kind==='enterprise'?'主体身份、关联产品与质量材料':'型号、制造主体、生产批次与质量材料')+tabs(items,state.detailTab)+`<div style="height:20px"></div>`+body}
function sourceView(){return heading('自动接入设置','仅持续 API / 定时同步需要连接配置；常规导入在提交时标注出处。',`<button data-create="sources" class="primary">登记来源</button>`)+tabs([['sources','来源配置'],['imports','导入任务']],state.tab==='imports'?'imports':'sources')+`<div style="height:20px"></div>`+(state.tab==='imports'?`<div class="panel empty">本次预览没有执行真实导入。正式实现应展示文件、映射版本、新建 / 重复 / 失败数量和逐行定位。</div>`:table([['来源 / 来源主体'],['允许类型','hide-mobile'],['接入方式'],['运行状态'],['操作']],sources.map((x,i)=>`<tr><td><strong>${esc(x.name)}</strong><small>${esc(x.party)}</small></td><td class="hide-mobile">${esc(x.types)}</td><td>${esc(x.connector)}</td><td>${tag(x.status)}</td><td><button class="link" data-source="${i}">查看配置</button></td></tr>`)))+`<div class="hint"><strong>按方式展开配置</strong><span>人工登记只选允许类型与范围；文件增加模板和映射；API 交给接入开发者配置并实际测试。常规上传无需在此预建来源。</span></div>`}
function categoryView(){return heading('分类与业务字典','低频配置独立维护，业务档案只选择已经启用的类别。',`<button data-create="categories" class="primary">新增类别</button>`)+table([['产品类别'],['使用范围'],['状态']],categories.map(x=>`<tr><td><strong>${esc(x)}</strong></td><td>本项目工业品目录</td><td>${tag('启用（演示）')}</td></tr>`))+`<div class="hint"><strong>首版保持有限配置</strong><span>后续按实际业务补缺陷类型、风险类型和单位。产品类别、业务类型和风险等级分别定义。</span></div>`}
function ruleView(){const standards=state.view==='standards';return heading(standards?'标准与检验规则':'风险与复核规则',standards?'专业要求由专家编制和确认，管理员负责版本发布与访问控制。':'选择受控模板，明确证据不足和独立复核的处理。')+`<div class="rule-grid"><section class="panel rule-block"><h2>${standards?'标准文件与适用范围':'风险规则草稿'}</h2><p>${standards?'编号、版本、原文件、生效区间、产品/类别范围与过渡条件。':'名称、版本、适用对象、风险条件及证据不足处理。'}</p><div class="hint">${standards?'不把最新版自动认定为所有产品的适用版本。':'没有校准依据时不默认输出一个风险概率。'}</div>${tag('待专业确认')}</section><section class="panel rule-block"><h2>${standards?'检验指标与判定条件':'独立复核与责任人'}</h2><p>${standards?'条款、指标、单位、方法、定性取值或数值条件；任务保存使用版本。':'提交人与复核人分离，补证、接受、退回都保留依据与责任人。'}</p><div class="hint">${standards?'管理员发布前需要专家确认，不能自行编造限值。':'技术账号与系统管理员不自动具备专业签发资格。'}</div>${tag('待确认后发布')}</section></div><div class="flow"><span>专家编制</span><i>→</i><span>专业确认</span><i>→</i><span>管理员发布版本</span><i>→</i><span>任务保留适用快照</span></div>`}
function architecture(){return heading('关系与配置职责','架构评审：对象、来源、专业依据和业务流程分别定义。')+`<div class="panel rule-block"><h2>三个起点，各自回答一个问题</h2><div class="steps"><div><strong>企业与产品档案</strong><span class="subtle">这份材料指向谁、哪个型号、哪个真实批次？</span></div><div><strong>标准与业务规则</strong><span class="subtle">用哪个版本、什么条件判断，需要谁复核？</span></div><div><strong>数据自动接入设置</strong><span class="subtle">材料来自哪里、怎样进入系统、哪些人可查看？</span></div></div></div><div class="flow"><span>来源 → 原始资料</span><i>→</i><span>关联企业 / 产品 / 批次</span><i>→</i><span>风险研判与独立复核</span><i>→</i><span>抽查 / 检测</span><i>→</i><span>处置复查与报告</span></div><div style="height:20px"></div>`+table([['身份'],['主要配置 / 输入'],['输出责任']], [['管理员','主体身份、目录、来源授权、权限、规则发布','基础治理与配置版本'],['专家','标准适用、证据、规则草稿、专业复核','经确认业务结论'],['普通用户','本人 / 分配任务的原文与附件','材料受理与本人结果'],['算法工程师','授权数据、评测与模型配置','技术评测和模型版本'],['应用开发者','接口映射、Agent 与工具配置','接入适配与调用结果'],['平台运营','运行阈值、告警、失败重试','运行状态与问题跟进']].map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`))+`<div class="ref-links"><a href="https://zlzx.zjamr.zj.gov.cn/pzcode/login" target="_blank" rel="noopener">浙江浙品码官方入口</a><a href="https://learning.sap.com/courses/applying-sap-s-4hana-quality-management/using-the-inspection-lot_e117d3a1-e7ce-4aad-9246-c0f176f8e388" target="_blank" rel="noopener">SAP QM 检验任务</a><a href="https://help.open.kingdee.com/dokuwiki_std/doku.php?id=质检方案" target="_blank" rel="noopener">金蝶质检方案</a><a href="https://www.labware.com/lims" target="_blank" rel="noopener">LabWare LIMS</a></div>`}
function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));$('#content').innerHTML=state.detail?detail():state.view==='archives'?archive():state.view==='sources'?sourceView():state.view==='categories'?categoryView():state.view==='architecture'?architecture():ruleView()}
function message(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',3200)}
function field(label,name,type='text',options=[],value=''){return `<label class="field"><span>${label}</span>${type==='select'?`<select name="${name}">${options.map(([k,n])=>`<option value="${esc(k)}" ${value===k?'selected':''}>${esc(n)}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="1" step="1"':''}>`}</label>`}
let editKind='',parent='';
function openForm(kind,p=''){editKind=kind;parent=p;const labels={enterprises:'登记企业档案',products:'登记产品 / 型号',batches:'登记真实生产批次',sources:'登记数据来源',categories:'登记产品类别'};$('#form-title').textContent=labels[kind];let html='<p class="subtle">仅保存演示数据；未知信息保持空白，不生成伪主体或伪批次。</p><p id="form-error" class="error" role="alert"></p>';if(kind==='enterprises')html+=field('企业名称 *','name')+field('主体角色（选填）','role','select',[['未知','未知'],['生产者','生产者'],['销售者','销售者'],['生产与销售','生产与销售']])+field('统一社会信用代码（选填，正式确认时核验）','credit')+field('所在地（选填）','city');if(kind==='products')html+=field('产品名称 *','name')+field('产品类别 *','category','select',categories.map(x=>[x,x]))+`<div class="form-row">${field('品牌（选填）','brand')}${field('型号（选填）','model')}</div>`+field('制造主体（选填，不将销售者自动当制造商）','manufacturer','select',[['','待确认'],...enterprises.filter(x=>x.role.includes('生产')).map(x=>[x.id,x.name])],ent(p)?.role.includes('生产')?p:'');if(kind==='batches')html+=field('具体产品 *','product','select',products.filter(x=>x.manufacturer&&x.status.startsWith('已确认')).map(x=>[x.id,x.name+' · '+x.model]),p)+field('真实批次号 *','no')+`<div class="form-row">${field('生产日期（未知可空）','date','date')}${field('实际数量（未知可空）','quantity','number')}</div>`;if(kind==='sources')html+=field('来源名称 *','name')+field('来源主体 *','party')+field('接入方式 *','connector','select',[['人工','人工'],['文件','文件'],['API','API（尚需适配）']])+field('允许数据类型 *','types');if(kind==='categories')html+=field('类别名称 *','name');$('#form-fields').innerHTML=html;$('#editor').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;state.detail=null;state.tab=state.view==='archives'?'enterprises':'sources';render()}if(b.dataset.tab){if(state.detail)state.detailTab=b.dataset.tab;else state.tab=b.dataset.tab;render()}if(b.dataset.detail){state.view='archives';state.detail=b.dataset.detail;state.detailTab=b.dataset.detailTab||'basic';render();window.scrollTo(0,0)}if(b.id==='back'){state.detail=null;render()}if(b.id==='search-btn'){state.query=$('#search').value;render()}if(b.id==='reset-btn'){state.query='';render()}if(b.dataset.create)openForm(b.dataset.create,b.dataset.parent||'');if(b.id==='cancel-form'||b.id==='close-form')$('#editor').close();if(b.dataset.source){const x=sources[Number(b.dataset.source)];message(`${x.name} · ${x.connector} · ${x.status}；真实配置与连接测试待实现。`)}});
$('#edit-form').addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const fail=s=>$('#form-error').textContent=s;const mandatory=editKind==='batches'?['product','no']:editKind==='sources'?['name','party','types']:['name'];if(mandatory.some(k=>!String(f[k]||'').trim()))return fail('请填写带 * 的字段。');const id=crypto.randomUUID();if(editKind==='enterprises')enterprises.push({id,name:f.name.trim(),credit:f.credit||'未提供',role:f.role,city:f.city||'未提供',status:'待确认'});if(editKind==='products'){products.push({id,name:f.name.trim(),category:f.category,brand:f.brand||'品牌待补充',model:f.model||'型号待补充',manufacturer:f.manufacturer||null,sellers:ent(parent)?.role==='销售者'?[parent]:[],status:'待确认'})}if(editKind==='batches'){if(batches.some(x=>x.product===f.product&&x.no===f.no.trim()))return fail('该产品下已存在相同真实批次号。');batches.push({id,product:f.product,no:f.no.trim(),date:f.date||'待补证',quantity:f.quantity?Number(f.quantity):null,status:'待确认'})}if(editKind==='sources')sources.push({...f,status:f.connector==='人工'?'可用（演示）':f.connector==='文件'?'待配置映射':'尚未接通'});if(editKind==='categories'){if(categories.includes(f.name.trim()))return fail('类别已存在。');categories.push(f.name.trim())}$('#editor').close();render();message('演示记录已保存；刷新页面后重置。')});
render();
</script>

<dialog id="intake-editor" aria-labelledby="intake-title"><form id="intake-form"><div class="dialog-head"><h2 id="intake-title">提交质量资料</h2><button type="button" data-intake-close aria-label="关闭资料提交">关闭</button></div><div class="form-body"><p class="subtle">先接收现有资料。已知的信息可带入，未知信息无需补齐才能提交。</p><p id="intake-error" class="error" role="alert"></p><label class="field"><span>资料文件或原始文字（至少提供一种）*</span><input name="material_file" type="file" accept=".csv,.xlsx,.json,.pdf,.txt,.png,.jpg,.jpeg"><small>本预览只记录演示文件名，不上传、不执行解析。</small></label><label class="field"><span>原始文字</span><textarea name="material_text" placeholder="直接粘贴原话或已有材料内容"></textarea></label><label class="field"><span>资料类型 *</span><select name="material_type"><option value="消费投诉">消费投诉</option><option value="监督抽查">监督抽查</option><option value="检测报告">检测报告</option><option value="执法案例">执法案例</option><option value="标准文件">标准文件</option><option value="企业资料">企业资料</option><option value="公开舆情">公开舆情</option></select></label><label class="field"><span>原始出处（选填）</span><input name="origin_label" placeholder="例如：某单位提供的抽检资料"><small>同一批资料填一次；未知可空。文件中逐条来源应在真实导入时保留。</small></label><details class="optional"><summary>对象与发生时间：已有信息再填</summary><label class="field"><span>产品或企业原始描述（选填）</span><input name="object_description" placeholder="不必拆成企业、品牌、型号等多个必填框"></label><label class="field"><span>真实生产批次号（选填）</span><input name="batch_ref" placeholder="不知道时留空"></label><label class="field"><span>实际发生时间（选填）</span><input name="occurred_at" type="datetime-local"></label></details></div><div class="dialog-foot"><button type="button" data-intake-close>取消</button><button type="submit" class="primary">演示提交</button></div></form></dialog>
<script>
const materialRows=[];
const priorRender=render;
function intakeView(){return heading('资料接入','监管资料与企业资料均可进入；首版先打通现有资料导入。',`<button id="open-intake" class="primary">提交 / 导入资料</button>`)+`<section class="panel intake-guide"><div><strong>1. 提供原始资料</strong><p>选择文件或粘贴原文，不先建完整企业和产品档案。</p></div><div><strong>2. 确认类型与出处</strong><p>出处随本次提交标注；文件 / 文本方式、提交人与接收时间自动记录。</p></div><div><strong>3. 按任务确认对象</strong><p>先保存原文与线索；需要追到企业、型号或批次时再核对。</p></div></section><div style="height:21px"></div>`+table([['资料'],['类型'],['原始出处','hide-mobile'],['对象线索','hide-medium'],['接收状态']],materialRows.map(x=>`<tr><td><strong>${esc(x.title)}</strong><small>${esc(x.channel)}</small></td><td>${esc(x.type)}</td><td class="hide-mobile">${esc(x.origin||'未知')}</td><td class="hide-medium">${esc(x.object||'待识别')}</td><td>${tag('演示受理')}</td></tr>`))+`<div class="hint"><strong>后台留痕，减少填写</strong><span>原文件、提交人、接收时间、哈希与可用定位由系统处理。品牌、信用代码、地点、条码、批次均按已有资料保留，不作为常规接收门槛。</span></div>`}
render=function(){if(state.view==='intake'&&!state.detail){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view==='intake'));$('#content').innerHTML=intakeView()}else priorRender()};
document.addEventListener('click',e=>{if(e.target.closest('#open-intake')){$('#intake-form').reset();$('#intake-error').textContent='';$('#intake-editor').showModal()}if(e.target.closest('[data-intake-close]'))$('#intake-editor').close()});
$('#intake-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const file=f.get('material_file');const text=String(f.get('material_text')||'').trim();if(!text&&!(file instanceof File&&file.size>0)){$('#intake-error').textContent='请提供原始文字或选择一个文件。';return}materialRows.unshift({title:file instanceof File&&file.size>0?file.name:text.slice(0,45),type:String(f.get('material_type')),origin:String(f.get('origin_label')||'').trim(),object:String(f.get('object_description')||'').trim(),channel:file instanceof File&&file.size>0?'文件（演示）':'原文（演示）',received:new Date().toISOString(),occurred:String(f.get('occurred_at')||''),batch:String(f.get('batch_ref')||'')});$('#intake-editor').close();render();message('已演示受理；未上传、未解析、未调用业务 API。')});
state.view='intake';state.detail=null;render();
</script>
<dialog id="task-editor" aria-labelledby="task-editor-title"><form id="task-preview-form"><div class="dialog-head"><h2 id="task-editor-title">新建分析与检测任务</h2><button type="button" data-task-close>关闭</button></div><div class="form-body"><p class="subtle">目标交互预览。现有正式任务接口仅支持图片；统一资料研判和数据核对仍待实现。</p><p id="task-preview-error" class="error" role="alert"></p><label class="field"><span>工作类型 *</span><select name="work_type" id="work-type"><option value="review">资料研判</option><option value="image">图片外观检查</option><option value="data">检测数据核对</option></select></label><label class="field"><span>本次要核查的问题 *</span><textarea name="work_goal">识别资料中的质量风险线索，列出依据与缺失信息。</textarea></label><label class="field"><span>选择已有材料</span><select name="existing_material" id="existing-material"></select><small>从材料详情发起时可自动带入，不要求重复上传。</small></label><label class="field"><span>或上传本次文件</span><input name="work_file" id="work-file" type="file" accept=".pdf,.txt,.csv,.xlsx,.json,.png,.jpg,.jpeg,.webp"><small id="work-file-hint">选择报告、投诉文件等原始材料。</small></label><details class="optional"><summary>对象与执行依据（已有信息再确认）</summary><label class="field"><span>产品类别（未知可空）</span><select name="work_category" id="work-category"></select></label><label class="field"><span>产品 / 型号 / 真实批次说明（选填）</span><input name="work_object" placeholder="保留来源已有信息，不编造未知批次"></label><label class="field"><span>标准或检查项目（选填，执行前按任务检查）</span><input name="work_basis" placeholder="未确定可先保存草稿，再补证或确认适用依据"></label></details><div class="hint"><strong>系统自动处理</strong><span>任务编号：保存后生成；创建人、时间自动记录。当前保存草稿，不启动实际检测。</span></div></div><div class="dialog-foot"><button type="button" data-task-close>取消</button><button type="submit" class="primary">保存演示草稿</button></div></form></dialog>
<script>
const taskRows=[];let taskDemoSequence=0;
const taskNav=document.createElement('button');taskNav.className='nav';taskNav.dataset.view='tasks';taskNav.textContent='分析与检测任务';document.querySelector('[data-view="intake"]').after(taskNav);
const priorTaskRender=render;
function taskView(){return heading('分析与检测任务','先确定要完成的工作，再按类型提供材料。系统自动编号。',`<button id="open-task-preview" class="primary">新建任务</button>`)+`<div class="preview">目标设计预览：现有正式任务仅支持图片；此页仅演示草稿与编号样式，不调用真实任务 API。</div>`+table([['任务标题 / 自动编号'],['工作类型'],['材料','hide-mobile'],['状态']],taskRows.map(x=>`<tr><td><strong>${esc(x.goal)}</strong><small class="mono">${esc(x.no)}</small></td><td>${esc(x.type)}</td><td class="hide-mobile">${esc(x.material)}</td><td>${tag('草稿（演示）')}</td></tr>`))+`<div class="hint"><strong>按目的决定必填项</strong><span>资料研判可以先接收未知对象；标准对标需要确认有效依据和条件。图片外观检查不能替代实际性能测量。</span></div>`}
render=function(){if(state.view==='tasks'&&!state.detail){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view==='tasks'));$('#content').innerHTML=taskView()}else priorTaskRender()};
function setWorkType(){const mode=$('#work-type').value;$('#work-file').accept=mode==='image'?'.png,.jpg,.jpeg,.webp':mode==='data'?'.csv,.xlsx,.json':'.pdf,.txt,.csv,.xlsx,.json,.png,.jpg,.jpeg,.webp';$('#work-file-hint').textContent=mode==='image'?'上传外观、标签等图片；不需要图片 URL。':mode==='data'?'上传实际测量表格；单位、方法、适用标准在正式核对前确认。':'选择报告、投诉等原始材料。';$('#work-file').value=''}
$('#work-type').addEventListener('change',setWorkType);
document.addEventListener('click',e=>{if(e.target.closest('#open-task-preview')){$('#task-preview-form').reset();$('#task-preview-error').textContent='';$('#existing-material').innerHTML='<option value="">请选择已有材料，或在下方上传文件</option>'+materialRows.map((x,i)=>`<option value="${i}">${esc(x.title)} · ${esc(x.type)}</option>`).join('');$('#work-category').innerHTML='<option value="">未知 / 暂不指定</option>'+categories.map(x=>`<option>${esc(x)}</option>`).join('');setWorkType();$('#task-editor').showModal()}if(e.target.closest('[data-task-close]'))$('#task-editor').close()});
$('#task-preview-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const file=f.get('work_file');const goal=String(f.get('work_goal')||'').trim();const selected=String(f.get('existing_material'));const provided=file instanceof File&&file.size>0;const ref=selected!==''?materialRows[Number(selected)]:null;const fail=s=>$('#task-preview-error').textContent=s;if(!goal)return fail('请说明本次要核查的问题。');if(!provided&&!ref)return fail('请选择已有材料或上传一个文件。');const filename=provided?file.name:ref.title;if(f.get('work_type')==='image'&&!/\.(png|jpe?g|webp)$/i.test(filename))return fail('图片外观检查需要图片材料，不能用报告文件代替图片。');if(f.get('work_type')==='data'&&provided&&!/\.(csv|xlsx|json)$/i.test(filename))return fail('检测数据核对请上传 CSV、XLSX 或 JSON；报告资料可先进入资料研判。');taskDemoSequence++;taskRows.unshift({no:'JC-20261003-'+String(taskDemoSequence).padStart(8,'0'),goal,type:{review:'资料研判',image:'图片外观检查',data:'检测数据核对'}[f.get('work_type')],material:filename});$('#task-editor').close();render();message('演示草稿已保存并生成示例编号；未启动实际检测。')});
render();
</script>
</body>
</html>
