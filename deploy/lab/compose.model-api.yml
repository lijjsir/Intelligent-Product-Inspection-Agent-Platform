name: piap-model-api

services:
  gateway:
    image: ${PIAP_MODEL_GATEWAY_IMAGE:-piap-model-api:current}
    container_name: piap-model-api
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 128m
    ports:
      - "${PIAP_MODEL_LAN_ADDRESS:?Set the server private LAN IP}:11434:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:11434/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
